name: Daily GitHub Brief

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the email in the workflow log instead of sending it'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SENDGRID_API_BASE: ${{ vars.SENDGRID_API_BASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "1" ]; then
            python brief.py --dry-run
          else
            python brief.py
          fi

      - name: Commit updated memory
        if: steps.mode.outputs.dry_run != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/brief_memory.json
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "Update brief memory"
            git push
          fi
