name: Daily GitHub Brief

on:
  schedule:
    # Run once at 7:17am America/Los_Angeles.
    - cron: '17 7 * * *'
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the email in the workflow log instead of sending it'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check for tracked updates
        if: github.event_name == 'schedule'
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 daily-github-brief/preflight.py

      - name: Stop if no tracked updates
        if: github.event_name == 'schedule' && steps.preflight.outputs.has_updates != '1'
        run: |
          echo "No new tracked commits; skipping dependency setup and email generation."
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: daily-github-brief/requirements.txt

      - name: Install dependencies
        run: pip install -r daily-github-brief/requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SENDGRID_API_BASE: ${{ vars.SENDGRID_API_BASE }}
          PUBLIC_ARCHIVE_BASE_URL: ${{ vars.PUBLIC_ARCHIVE_BASE_URL }}
          MAILING_LIST_URL: ${{ vars.MAILING_LIST_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "1" ]; then
            python daily-github-brief/brief.py --dry-run
          else
            python daily-github-brief/brief.py
          fi

      - name: Commit updated memory and archive
        if: steps.mode.outputs.dry_run != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/briefs
          if git diff --cached --quiet -- docs/briefs; then
            echo "No archived brief changes; skipping memory-only commit."
          else
            git add daily-github-brief/state/brief_memory.json
            git commit -m "Update brief memory"
            git push
          fi
