name: Daily GitHub Brief

on:
  schedule:
    # Run away from the top of the hour, with a backup in the same hour.
    # Gate below keeps only runs that occur during 8am America/Los_Angeles.
    - cron: '7,37 15 * * *'
    - cron: '7,37 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the email in the workflow log instead of sending it'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check 8am PT window for scheduled runs
        if: github.event_name == 'schedule'
        id: pt_window
        shell: bash
        run: |
          PT_HOUR="$(TZ=America/Los_Angeles date +%H)"
          if [ "$PT_HOUR" = "08" ]; then
            echo "run_now=1" >> "$GITHUB_OUTPUT"
          else
            echo "run_now=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if outside 8am PT (schedule only)
        if: github.event_name == 'schedule' && steps.pt_window.outputs.run_now != '1'
        run: |
          echo "Not 8am PT right now; exiting." 
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r daily-github-brief/requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SENDGRID_API_BASE: ${{ vars.SENDGRID_API_BASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "1" ]; then
            python daily-github-brief/brief.py --dry-run
          else
            python daily-github-brief/brief.py
          fi

      - name: Commit updated memory
        if: steps.mode.outputs.dry_run != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-github-brief/state/brief_memory.json
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "Update brief memory"
            git push
          fi
